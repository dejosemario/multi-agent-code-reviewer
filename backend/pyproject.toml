[project]
name = "multi-agent-code-reviewer"
version = "0.1.0"
description = "Agentic multi-agent AI code review system"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic-settings==2.7.1",
    "langchain==1.4.0",
    "langchain-openai==1.6.2",
    "langchain-core==1.6.3",
    "langgraph==1.2.11",
    "unidiff==1.0.1",
    "GitPython==3.1.62",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "httpx==0.28.1",
    "ruff==0.8.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
